# PROD: postgres + migrate + server + client(nginx).
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
name: zexn

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Host porti YO'Q: DB faqat compose tarmog'ida
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - zexn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Migratsiya alohida, bir martalik: server bir necha replika bo'lsa ham migratsiya bitta
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: zexn-server
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: zexn-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    image: zexn-client
    restart: unless-stopped
    ports:
      # Default faqat localhost: oldida host nginx/caddy (HTTPS) turadi. To'g'ridan-to'g'ri: HTTP_PORT=80
      - "${HTTP_PORT:-127.0.0.1:8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  zexn_pgdata:
