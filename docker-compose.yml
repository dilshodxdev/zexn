# DEV: faqat Postgres. Client/server lokal `pnpm dev` bilan (hot reload).
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: zexn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zexn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zexn}
      POSTGRES_DB: ${POSTGRES_DB:-zexn}
    ports:
      # Host port .env dagi POSTGRES_PORT (default 5432). Boshqa Postgres band qilsa o'zgartir.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zexn_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zexn} -d ${POSTGRES_DB:-zexn}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zexn_pgdata_dev:
