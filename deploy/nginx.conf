# Client konteyneri ichidagi nginx: statik fayllar + /api/ -> server proxy.

# Docker ichki DNS. `valid=10s`: server konteyneri qayta ko'tarilsa yangi IP olinadi.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O'zgaruvchi orqali proxy_pass: nginx startda emas, har so'rovda resolve qiladi
    set $api_upstream http://server:4000;

    # /api/health -> server /health (prefikssiz). Aniq mos kelish (=) prefix'dan ustun.
    location = /api/health {
        proxy_pass $api_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/* -> server /api/* (prefiks saqlanadi)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hash'li assetlar: bir yil, immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA: service worker va manifest doim yangi (aks holda yangi deploy telefonlarga yetmaydi)
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; application/javascript js; }
        try_files $uri =404;
    }

    # index.html hech qachon cache'lanmasin: yangi deploy darrov ko'rinsin
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: React Router yo'llari
    location / {
        try_files $uri /index.html;
    }
}
